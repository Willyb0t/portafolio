<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Demo</title>
    <style>
        body {
            background-color: #000000;
            color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Stars background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }

        /* Content area */
        .content {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
        }

        .description {
            color: #00b4d8;
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .stat {
            background-color: rgba(0, 180, 216, 0.1);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00b4d8;
            display: block;
        }

        .stat-label {
            font-size: 1rem;
            color: #f8f9fa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(248, 249, 250, 0.5);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="content">
        <h1>Willyb0t</h1>
        <p class="description">
            Physics Enthusiast & Full-Stack Developer<br/>
            Creating interactive experiences at the intersection of science and code
        </p>

        <div class="stats">
            <div class="stat">
                <span class="stat-value">5+</span>
                <span class="stat-label">Projects</span>
            </div>
            <div class="stat">
                <span class="stat-value">3</span>
                <span class="stat-label">Years Experience</span>
            </div>
            <div class="stat">
                <span class="stat-value">10+</span>
                <span class="stat-label">Technical Skills</span>
            </div>
            <div class="stat">
                <span class="stat-value">2</span>
                <span class="stat-label">Publications</span>
            </div>
        </div>

        <div class="footer">
            © 2026 Willyb0t. All rights reserved.
        </div>
    </div>

    <script>
        // Simple starfield simulation
        document.addEventListener('DOMContentLoaded', function() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                // Random position
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';

                // Random size
                const size = Math.random() * 3 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                // Random opacity
                star.style.opacity = Math.random() * 0.7 + 0.3;

                // Add to container
                starsContainer.appendChild(star);
            }
        });
    </script>
</body>
</html>
