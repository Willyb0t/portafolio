<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Mockup</title>
    <style>
        body {
            background-color: #000000;
            color: #f8f9fa;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .content {
            max-width: 800px;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #00b4d8;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #00b4d8;
            color: white;
        }
        .btn-secondary {
            background-color: transparent;
            border: 2px solid #00b4d8;
            color: #00b4d8;
        }
        .btn-primary:hover {
            background-color: #009ec8;
        }
        .btn-secondary:hover {
            background-color: rgba(0, 180, 216, 0.1);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Willyb0t</h1>
        <p>Physics Enthusiast & Full-Stack Developer</p>
        <div class="buttons">
            <button class="btn-primary">About Me</button>
            <button class="btn-secondary">View Projects</button>
        </div>
    </div>
</body>
</html>
